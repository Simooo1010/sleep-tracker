<!doctype html>
<html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap"></head>
<body><div class="stage">
<div class="pane"><div class="cap">Elenco di sezioni</div>
<div class="stack">
<button class="list-row"><span class="dot" style="background:var(--blue)"></span><span class="tx"><span class="tt">Confronto tra notti</span><span class="ss">14 notti con la fascia ± 30 min</span></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
<button class="list-row"><span class="dot" style="background:var(--sage)"></span><span class="tx"><span class="tt">Indicatori</span><span class="ss">Scarti, punto medio, social jet lag</span></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
<button class="list-row"><span class="dot" style="background:var(--peach)"></span><span class="tx"><span class="tt">Deriva della media</span><span class="ss">+42 min in 5 settimane</span></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
<button class="list-row"><span class="dot" style="background:var(--yellow)"></span><span class="tx"><span class="tt">Sonnellino</span><span class="ss">Ieri 32 min · tocca per iniziare</span></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button></div></div>
</div>
<script>var p=document.querySelector('.pane'),q=p.cloneNode(true);q.setAttribute('data-theme','scuro');p.after(q);</script>
</body></html>
