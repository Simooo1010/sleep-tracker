<!doctype html>
<html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap"></head>
<body><div class="stage">
<div class="pane"><div class="card stack" style="gap:14px">
<div class="row" style="justify-content:space-between"><div class="eyebrow">Deriva della mediana</div><span class="badge badge-out">+42 min in 5 settimane</span></div>
<div class="vbars" style="height:120px" id="b"></div>
<div class="row" style="flex-wrap:nowrap;gap:8px;font-size:11px;color:var(--ink-muted)" id="l"></div>
<div class="muted" style="font-size:14px;line-height:21px">La mediana del tuo orario di letto si è spostata da 23:04 a 23:46. È oltre la tolleranza di ± 30 min.</div></div></div>
</div>
<script>
var V=[['23:04',31],['23:13',41],['23:24',53],['23:34',64],['23:42',73],['23:46',78]],L=['5 sett. fa','4','3','2','1','Ora'],b='',l='';
V.forEach(function(v,i){b+='<div style="flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px"><div style="font-size:11px;color:var(--ink-muted)">'+v[0]+'</div><div class="vbar'+(i==5?' is-now':'')+'" style="width:100%;height:'+v[1]+'%"></div></div>';l+='<div style="flex:1 1 0;text-align:center">'+L[i]+'</div>';});
document.getElementById('b').innerHTML=b;document.getElementById('l').innerHTML=l;
var p=document.querySelector('.pane'),q=p.cloneNode(true);q.setAttribute('data-theme','scuro');p.after(q);
</script>
</body></html>
