<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Sleep Tracker">
  <title>Sleep Tracker</title>
  <rect width="1024" height="1024" fill="#161a22"/>
  <defs>
    <!-- Campo di colore: più sfumature di azzurro pastello sovrapposte, non un gradiente lineare -->
    <linearGradient id="base" x1="150" y1="130" x2="900" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e1edfd"/>
      <stop offset="0.5" stop-color="#bcd3f4"/>
      <stop offset="1" stop-color="#9dbbe8"/>
    </linearGradient>
    <radialGradient id="b1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#86a9e0" stop-opacity="0.95"/><stop offset="1" stop-color="#86a9e0" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#f3f8ff" stop-opacity="1"/><stop offset="1" stop-color="#f3f8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#aab9ec" stop-opacity="0.9"/><stop offset="1" stop-color="#aab9ec" stop-opacity="0"/></radialGradient>
    <radialGradient id="b4" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7499d6" stop-opacity="0.9"/><stop offset="1" stop-color="#7499d6" stop-opacity="0"/></radialGradient>
    <radialGradient id="b5" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#cde2fb" stop-opacity="1"/><stop offset="1" stop-color="#cde2fb" stop-opacity="0"/></radialGradient>

    <!-- Forma: luna a falce + nuvola, con un filo di vuoto attorno alla nuvola -->
    <g id="cloud">
      <circle cx="235" cy="690" r="90"/>
      <circle cx="775" cy="690" r="90"/>
      <rect x="235" y="600" width="540" height="180"/>
      <circle cx="385" cy="635" r="115"/>
      <circle cx="575" cy="590" r="150"/>
      <circle cx="690" cy="655" r="105"/>
    </g>
    <mask id="shape" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#000"/>
      <circle cx="725" cy="402" r="190" fill="#fff"/>
      <circle cx="817" cy="344" r="158" fill="#000"/>
      <use href="#cloud" fill="#000" stroke="#000" stroke-width="36" stroke-linejoin="round"/>
      <use href="#cloud" fill="#fff"/>
    </mask>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>
  <g transform="translate(512 512) scale(1.06) translate(-525 -496)">
    <g mask="url(#shape)">
      <rect x="120" y="100" width="820" height="720" fill="url(#base)"/>
      <g filter="url(#soft)">
        <ellipse cx="300" cy="730" rx="240" ry="130" fill="url(#b1)"/>
        <ellipse cx="560" cy="520" rx="200" ry="110" fill="url(#b2)"/>
        <ellipse cx="800" cy="710" rx="170" ry="110" fill="url(#b4)"/>
        <ellipse cx="660" cy="380" rx="150" ry="150" fill="url(#b3)"/>
        <ellipse cx="430" cy="640" rx="190" ry="100" fill="url(#b5)"/>
        <ellipse cx="840" cy="310" rx="110" ry="90" fill="url(#b1)"/>
      </g>
    </g>
  </g>
</svg>
