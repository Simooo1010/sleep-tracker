name: app

on:
  pull_request:
    paths:
      - 'app/**'
      - 'docs/design/**'
      - '.github/workflows/app.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'docs/design/**'
      - '.github/workflows/app.yml'

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # typecheck + lint + vitest (include il controllo che tokens.css/bundle.css/icone siano allineati a docs/design)
      - run: npm run check

      - run: npm run build

      - name: Installa Chromium per Playwright
        run: npx playwright install --with-deps chromium

      # Il progetto "iphone" usa WebKit solo se installato; qui gira su Chromium con emulazione iPhone.
      - run: npm run e2e

      - name: Screenshot e report E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            app/test-results/
            app/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
